[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "frappe-odoo-service"
version = "0.1.0"
description = "Multi-tenant one-way sync service from Frappe/ERPNext to Odoo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
]

[project.scripts]
frappe-odoo-sync = "frappe_odoo_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
